name: Test platform panels and accounting

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix functions install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/partner-functions.js
          node --check functions/admin-deletion.js
          node --check public/app.js
      - name: Test Firebase permissions and ledger
        run: npm run test:emulator
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile panels
        run: npm run test:ui
